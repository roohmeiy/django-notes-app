name: Deploy Django App

on:
  workflow_dispatch:

env:
  IMAGE_NAME: django-todo-app

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - run: |
          docker build -t ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} .
          docker push ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image_tag }}
            docker rm -f django_container || true
            docker run -d --name django_container -p 8000:8000 ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image_tag }}